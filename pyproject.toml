[project]
name = "solbuddy-access"
version = "0.1.0.dev4"
description = "Local, default-deny guest access foundation for Home Assistant"
requires-python = ">=3.14.2,<3.15"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/FilipposPirpilidis/solbuddy-access"
Documentation = "https://github.com/FilipposPirpilidis/solbuddy-access#readme"

[dependency-groups]
dev = [
  "homeassistant==2026.10.2",
  "pytest-homeassistant-custom-component==0.13.373",
  "pytest==9.0.3",
  "ruff==0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
